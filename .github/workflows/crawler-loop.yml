name: Sukebei Crawler Loop
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
permissions:
  contents: write
  actions: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    concurrency:
      group: crawler-loop
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4
      - name: Run Crawler (跑满5h50min 或跑完全部)
        continue-on-error: true
        timeout-minutes: 9
        run: |
          echo "Starting crawler..."
          python nyaa_crawler_proxy2.py \
            --workers 5 \
            --min-delay 0.8 \
            --max-delay 1.1 \
            --batch-size 0
      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add crawler_state.json nyaa_*.jsonl || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "crawler: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            git push
          fi
      - name: Trigger next run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next run..."
          gh workflow run "Sukebei Crawler Loop" --ref main
